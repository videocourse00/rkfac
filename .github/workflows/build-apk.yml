name: Build RKFAC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 8.14.3
        run: |
          curl -L --fail --retry 3 \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.14.3-bin.zip

          unzip -q gradle.zip -d "$HOME"

          echo "$HOME/gradle-8.14.3/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle clean
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RKFAC-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
