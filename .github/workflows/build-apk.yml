name: Build & Release RKFAC APK

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.0"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle 8.14.3
        run: |
          curl -L --fail --retry 3 \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.14.3-bin.zip

          unzip -q gradle.zip -d "$HOME"

          echo "$HOME/gradle-8.14.3/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle clean
          gradle assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release

          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release/RKFAC.apk

          ls -lh release/RKFAC.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RKFAC-APK
          path: release/RKFAC.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"

          gh release create "$TAG" \
            release/RKFAC.apk \
            --title "RK Educare $TAG" \
            --generate-notes
